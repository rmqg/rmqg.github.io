baseURL = 'https://blog.rmqg.org/'
locale = 'zh-CN'
title = '若木秋光のBlog Ver.3.0'

defaultContentLanguage = 'zh-CN'
[languages]
[languages.en]
label = 'English'
weight = 1
[languages.zh-CN]
label = '简体中文'
weight = 1
hasCJKLanguage = true
[languages.zh-TW]
label = '繁體中文'
weight = 1
hasCJKLanguage = true
[languages.ja]
label = '日本語'
weight = 1
hasCJKLanguage = true

[markup.goldmark.extensions.passthrough]
enable = true
delimiters.block = [["\\[", "\\]"], ["$$", "$$"]]
delimiters.inline = [["\\(", "\\)"], ["$", "$"]]

[markup.highlight]
guessSyntax = true
noClasses = false

[outputs]
# home = ["Algolia", "HTML", "RSS"]
home = ["HTML", "RSS"]

## Algolia
# [outputFormats.Algolia]
# baseName = "algolia"
# isPlainText = true
# mediaType = "application/json"
# notAlternative = true

[module]
[[module.imports]]
path = 'hugo-theme-reimu'
[[module.imports.mounts]]
source = 'archetypes'
target = 'archetypes'
[[module.imports.mounts]]
source = 'assets'
target = 'assets'
[[module.imports.mounts]]
source = 'data/vendor.yml'
target = 'data/vendor.yml'
[[module.imports.mounts]]
source = 'i18n'
target = 'i18n'
[[module.imports.mounts]]
source = 'layouts'
target = 'layouts'
[[module.imports.mounts]]
source = 'static'
target = 'static'
[[module.imports.mounts]]
source = 'package.json'
target = 'assets/_jsconfig/package.json'
